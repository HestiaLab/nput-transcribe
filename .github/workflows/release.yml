name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENVINO_VERSION: "2026.4.1"

jobs:
  package:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenVINO runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "openvino==${OPENVINO_VERSION}"
          echo "OPENVINO_ROOT=$(python -c 'import openvino, os; print(os.path.dirname(openvino.__file__))')" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/release

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build/release --output-on-failure

      - name: Verify tag matches project version
        shell: msys2 {0}
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/release/CMakeCache.txt | tr -d '\r')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}" >&2
            exit 1
          fi

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild -OutDir dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
